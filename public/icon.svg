<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="wv-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#542A0C"/>
      <stop offset="100%" stop-color="#220e04"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#wv-grad)"/>

  <!-- Watch Strap Top -->
  <rect x="25" y="6" width="14" height="10" rx="3" fill="url(#gold-grad)" opacity="0.9"/>
  <!-- Watch Strap Bottom -->
  <rect x="25" y="48" width="14" height="10" rx="3" fill="url(#gold-grad)" opacity="0.9"/>

  <!-- Outer Watch Bezel -->
  <circle cx="32" cy="32" r="19" fill="#2d1405" stroke="url(#gold-grad)" stroke-width="2.5"/>

  <!-- Inner Watch Dial -->
  <circle cx="32" cy="32" r="15" fill="#180a02"/>

  <!-- Hour markers -->
  <circle cx="32" cy="19.5" r="1.2" fill="#FDE047"/>
  <circle cx="44.5" cy="32" r="1.2" fill="#FDE047"/>
  <circle cx="32" cy="44.5" r="1.2" fill="#FDE047"/>
  <circle cx="19.5" cy="32" r="1.2" fill="#FDE047"/>

  <!-- Watch Hands (showing ~ 10:10 luxury position) -->
  <!-- Hour Hand -->
  <line x1="32" y1="32" x2="25" y2="24" stroke="url(#gold-grad)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Minute Hand -->
  <line x1="32" y1="32" x2="41" y2="22" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Second Hand Accent -->
  <line x1="32" y1="34" x2="32" y2="20" stroke="#EF4444" stroke-width="1" stroke-linecap="round"/>

  <!-- Center Pin -->
  <circle cx="32" cy="32" r="2.2" fill="#FDE047"/>
  <circle cx="32" cy="32" r="1" fill="#180a02"/>
</svg>
